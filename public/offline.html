<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — DriverHub</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               background: #0e141b; color: #c8d2de; font-family: system-ui, sans-serif; text-align: center; padding: 2rem; }
        .mark { width: 54px; height: 54px; border-radius: 4px; background: #d4560f; color: #fff;
                display: grid; place-items: center; font-weight: 700; margin: 0 auto 1.25rem; }
        h1 { color: #fff; font-size: 1.25rem; margin: 0 0 .5rem; }
        p { margin: 0; font-size: .9rem; color: #7b8b9f; }
    </style>
</head>
<body>
    <div>
        <div class="mark">DH</div>
        <h1>No connection</h1>
        <p>DriverHub needs a network to load your data. It will pick up where you left off once you are back online.</p>
    </div>
</body>
</html>
